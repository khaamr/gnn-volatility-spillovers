<rect x="48" y="764" width="527" height="116" rx="14" fill="#fff" stroke="#dbe6e0" stroke-width="1.5"/>
<text x="72" y="800" fill="#183239" font-size="25" font-weight="700" text-anchor="start">50% forecast-accuracy objective</text>
<text x="72" y="831" fill="#526970" font-size="20" font-weight="400" text-anchor="start">historically normalized frobenius distance</text>
<text x="72" y="859" fill="#526970" font-size="19" font-weight="400" text-anchor="start">evaluate euclidean, frobenius and qlike losses</text>
<rect x="623" y="764" width="529" height="116" rx="14" fill="#fff" stroke="#dbe6e0" stroke-width="1.5"/>
<text x="647" y="800" fill="#183239" font-size="25" font-weight="700" text-anchor="start">50% portfolio-risk objective</text>
<text x="647" y="831" fill="#526970" font-size="19" font-weight="400" text-anchor="start">historically normalized squared portfolio return</text>
<text x="647" y="859" fill="#526970" font-size="20" font-weight="400" text-anchor="start">exact long-only optimization for evaluation</text>
<path d="M312 880V909H600V929" stroke="#76948e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M887 880V909H600" stroke="#76948e" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="48" y="932" width="1104" height="126" rx="14" fill="#fff" stroke="#dbe6e0" stroke-width="1.5"/>
<text x="72" y="968" fill="#183239" font-size="26" font-weight="700" text-anchor="start">historical validation + paired two-endpoint assessment</text>
<text x="72" y="1000" fill="#526970" font-size="20" font-weight="400" text-anchor="start">378+ earlier labels · 126-label inner validation · report the static and previous controls</text>
<text x="72" y="1030" fill="#526970" font-size="20" font-weight="400" text-anchor="start">accept only if both primary paired intervals favor the candidate over har-drd</text>
<text x="48" y="1103" fill="#0f7166" font-size="21" font-weight="700" text-anchor="start">reused 2025–2026 benchmark</text>
<text x="48" y="1137" fill="#183239" font-size="25" font-weight="700" text-anchor="start">frobenius error −1.79% · long-only annual risk 9.435% → 9.406%</text>
<text x="48" y="1171" fill="#526970" font-size="20" font-weight="400" text-anchor="start">risk interval includes zero: the predefined joint improvement criterion is not passed</text>
</g></svg>